name: Scrape Movida

permissions:
  contents: write

on:
  workflow_dispatch: # Manual trigger only

jobs:
  scrape-movida:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Movida scraper
      run: |
        python fleet.py scrape-movida --out movida_offers.json --delay 1.2
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: movida-offers-${{ github.run_number }}
        path: |
          movida_offers.json
          movida_offers.meta.json
        retention-days: 30
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add movida_offers.json movida_offers.meta.json
        git diff --staged --quiet || git commit -m "chore: update Movida offers [skip ci]"
        git push
