name: Match Localiza

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to match (YYYYMMDD format, e.g., 20251215). Leave empty for newest file.'
        required: false
        type: string

jobs:
  match-localiza:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p data/localiza
    
    - name: Match Localiza to FIPE
      run: |
        if [ -n "${{ inputs.date }}" ]; then
          python fleet.py match-localiza --date ${{ inputs.date }} --threshold 0.0
        else
          python fleet.py match-localiza --threshold 0.0
        fi
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: localiza-matched-${{ github.run_number }}
        path: |
          data/localiza/*.csv
        retention-days: 60
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/localiza/*.csv
        git diff --staged --quiet || git commit -m "chore: update Localiza matched data [skip ci]"
        git push
