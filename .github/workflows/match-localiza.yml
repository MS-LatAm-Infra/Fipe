name: Match Localiza

permissions:
  contents: write

on:
  workflow_dispatch: # Manual trigger only

jobs:
  match-localiza:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p data/localiza
    
    - name: Match Localiza to FIPE
      run: |
        DATESTAMP=$(date +'%Y%m%d')
        python fleet.py match-localiza --out data/localiza/localiza_with_fipe_match_${DATESTAMP}.csv --threshold 0.0
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: localiza-matched-${{ github.run_number }}
        path: |
          data/localiza/*.csv
        retention-days: 60
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/localiza/*.csv
        git diff --staged --quiet || git commit -m "chore: update Localiza matched data [skip ci]"
        git push
