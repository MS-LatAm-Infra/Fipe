name: Collect Seminovos Fipe Prices

permissions:
  contents: write

on:
  workflow_dispatch: # Manual trigger only
    inputs:
      since:
        description: 'FIPE since month (e.g., 2023-11)'
        required: false
        default: '2023-11'
      tipos:
        description: 'Vehicle types (1=Cars, 2=Motos, 3=Trucks)'
        required: false
        default: '1'

jobs:
  fipe-dump:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p data/fipe data/tuples
    
    - name: Run FIPE dump
      run: |
        DATESTAMP=$(date +'%Y%m%d')
        SINCE="${{ github.event.inputs.since || '2023-11' }}"
        TIPOS="${{ github.event.inputs.tipos || '1' }}"
        python fleet.py fipe-dump \
          --since ${SINCE} \
          --tipos ${TIPOS} \
          --out data/fipe/fipe_dump_${DATESTAMP}.csv \
          --rps 2 \
          --max-concurrency 8
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fipe-dump-${{ github.run_number }}
        path: |
          data/fipe/*.csv
          data/tuples/*.csv
        retention-days: 90
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/fipe/*.csv data/tuples/*.csv
        git diff --staged --quiet || git commit -m "chore: update FIPE dump data [skip ci]"
        git push
