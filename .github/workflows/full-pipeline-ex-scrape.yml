name: Run Full Pipeline (ex-Scrape)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYYMMDD format, e.g., 20251215). Leave empty for newest file.'
        required: false
        type: string
      since:
        description: 'FIPE since month (e.g., 2023-11)'
        required: false
        default: '2023-11'
      tipos:
        description: 'Vehicle types (1=Cars, 2=Motos, 3=Trucks)'
        required: false
        default: '1'

jobs:
  parse-localiza:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p raw/localiza
    
    - name: Parse Localiza JSON to CSV
      run: |
        if [ -n "${{ inputs.date }}" ]; then
          python fleet.py parse-localiza --date ${{ inputs.date }} --out-dir raw/localiza
        else
          python fleet.py parse-localiza --out-dir raw/localiza
        fi
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: localiza-parsed-${{ github.run_number }}
        path: |
          raw/localiza/*.csv
        retention-days: 30
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add raw/localiza/*.csv
        git diff --staged --quiet || git commit -m "chore: update Localiza parsed data [skip ci]"
        git push

  parse-movida:
    runs-on: ubuntu-latest
    needs: parse-localiza
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
      
    - name: Pull latest changes
      run: git pull origin ${{ github.ref_name }}
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p raw/movida
    
    - name: Parse Movida JSON to CSV
      run: |
        if [ -n "${{ inputs.date }}" ]; then
          python fleet.py parse-movida --date ${{ inputs.date }} --out-dir raw/movida
        else
          python fleet.py parse-movida --out-dir raw/movida
        fi
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: movida-parsed-${{ github.run_number }}
        path: |
          raw/movida/*.csv
        retention-days: 30
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add raw/movida/*.csv
        git diff --staged --quiet || git commit -m "chore: update Movida parsed data [skip ci]"
        git push

  match-localiza:
    runs-on: ubuntu-latest
    needs: parse-movida
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
      
    - name: Pull latest changes
      run: git pull origin ${{ github.ref_name }}
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p data/localiza
    
    - name: Match Localiza to FIPE
      run: |
        if [ -n "${{ inputs.date }}" ]; then
          python fleet.py match-localiza --date ${{ inputs.date }} --threshold 0.0
        else
          python fleet.py match-localiza --threshold 0.0
        fi
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: localiza-matched-${{ github.run_number }}
        path: |
          data/localiza/*.csv
        retention-days: 60
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/localiza/*.csv
        git diff --staged --quiet || git commit -m "chore: update Localiza matched data [skip ci]"
        git push

  fipe-dump:
    runs-on: ubuntu-latest
    needs: match-localiza
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
      
    - name: Pull latest changes
      run: git pull origin ${{ github.ref_name }}
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p data/fipe data/tuples
    
    - name: Run FIPE dump
      run: |
        DATESTAMP=$(date +'%Y%m%d')
        SINCE="${{ github.event.inputs.since || '2023-11' }}"
        TIPOS="${{ github.event.inputs.tipos || '1' }}"
        python fleet.py fipe-dump \
          --since ${SINCE} \
          --tipos ${TIPOS} \
          --out data/fipe/fipe_dump_${DATESTAMP}.csv \
          --rps 2 \
          --max-concurrency 8
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fipe-dump-${{ github.run_number }}
        path: |
          data/fipe/*.csv
          data/tuples/*.csv
        retention-days: 90
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/fipe/*.csv data/tuples/*.csv
        git diff --staged --quiet || git commit -m "chore: update FIPE dump data [skip ci]"
        git push
