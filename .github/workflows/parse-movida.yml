name: Parse Movida

permissions:
  contents: write

on:
  workflow_dispatch: # Manual trigger only

jobs:
  parse-movida:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p raw/movida
    
    - name: Parse Movida JSON to CSV
      run: |
        python fleet.py parse-movida --in movida_offers.json --out-dir raw/movida
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: movida-parsed-${{ github.run_number }}
        path: |
          raw/movida/*.csv
        retention-days: 30
    
    - name: Commit and push changes
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add raw/movida/*.csv
        git diff --staged --quiet || git commit -m "chore: update Movida parsed data [skip ci]"
        git push
